<div class="modal fade" id="deviceDiagnosticSuccessModal" tabindex="-1"
     aria-labelledby="deviceDiagnosticSuccessTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content device-scan-success">
            <div class="modal-body text-center p-4 p-md-5">
                <div class="device-scan-success-icon" aria-hidden="true">
                    <i class="bi bi-check-lg"></i>
                </div>
                <h2 class="h4 mt-3" id="deviceDiagnosticSuccessTitle">
                    Device Scan Completed Successfully
                </h2>
                <p class="text-muted mb-1">
                    The device has been analyzed and the results are now available.
                </p>
                <p class="fw-semibold" role="status" aria-live="polite">
                    Redirecting to scan results in
                    <span id="deviceDiagnosticCountdown">5</span> seconds...
                </p>
                <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
                    <a class="btn btn-primary" id="deviceDiagnosticViewResultsButton" href="#">
                        <i class="bi bi-clipboard-data me-1"></i>View Results
                    </a>
                    <a class="btn btn-outline-primary" id="deviceDiagnosticViewDeviceButton" href="{{ url_for('devices') }}">
                        <i class="bi bi-pc-display me-1"></i>View Device
                    </a>
                    <a class="btn btn-outline-secondary" id="deviceDiagnosticDashboardButton"
                       href="{{ url_for('dashboard') }}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                    <button class="btn btn-outline-light" id="deviceDiagnosticCloseButton"
                            type="button" data-bs-dismiss="modal">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
